
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Ponto - GeoPoint</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>GeoPoint</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="formulario.html">Cadastrar ponto</a>
    </nav>
  </header>

  <main class="pagina-formulario">
    <h2 id="titulo-formulario">Cadastrar Ponto</h2>

    <form id="form-ponto" class="formulario">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" maxlength="100" required>

      <label for="descricao">Descrição:</label>
      <textarea id="descricao" maxlength="255"></textarea>

      <label for="latitude">Latitude:</label>
      <input
        type="number"
        id="latitude"
        min="-90"
        max="90"
        step="any"
        required
      >

      <label for="longitude">Longitude:</label>
      <input
        type="number"
        id="longitude"
        min="-180"
        max="180"
        step="any"
        required
      >

      <button type="submit" id="btn-salvar">Cadastrar</button>
    </form>

    <p id="mensagem"></p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/formulario.js"></script>

</body>
</html>
